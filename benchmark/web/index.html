<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FAH Saver renderer comparison</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; background: #050609; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #controls, #status, #result { position: fixed; z-index: 1; padding: .7rem; background: #111e; border-radius: .4rem; }
    #controls { top: .7rem; left: .7rem; display: flex; gap: .7rem; align-items: end; flex-wrap: wrap; max-width: calc(100vw - 2.8rem); }
    label { display: grid; gap: .25rem; } input, select, button { font: inherit; }
    input[type=number] { width: 5rem; } input[type=file] { max-width: 15rem; }
    #status { bottom: .7rem; left: .7rem; margin: 0; max-width: calc(100vw - 2.8rem); }
    #status.error { color: #ffb5b5; } #result { bottom: .7rem; right: .7rem; max-height: 65vh; overflow: auto; max-width: 45vw; white-space: pre-wrap; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Protein model rendering"></canvas>
  <form id="controls">
    <label>Capture JSON<input id="capture" type="file" accept=".json,application/json"></label>
    <label>Playback<select id="playback"><option value="latest">Latest snapshot</option><option value="loop">Loop snapshots</option></select></label>
    <label>Style<select id="style"><option value="1">Space-filling</option><option value="2">Ball-and-stick</option><option value="3">Sticks</option><option value="cycle">Cycle styles</option><option value="random">Random styles</option></select></label>
    <label>Frame limit<input id="fps" type="number" min="1" max="240" value="60"></label>
    <label>Background<select id="background"><option value="sky">Sky and grid</option><option value="solid">Solid colour</option></select></label>
    <label>Solid colour<input id="colour" type="color" value="#050609"></label>
    <label>Trial seconds<input id="seconds" type="number" min="1" max="3600" value="30"></label>
    <button id="start" type="submit">Run trial</button>
  </form>
  <p id="status" role="status">Choose a capture JSON file or drop it here.</p>
  <pre id="result" hidden></pre>
  <script src="capture.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
