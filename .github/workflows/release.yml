name: Build release draft

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    # This public runner is ARM64. Intel Macs are not a release target.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check release tag and host
        run: |
          test "$(uname -m)" = arm64
          python3 tools/release.py check-version --tag "$RELEASE_TAG"
      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja glslang nsis
          test "$(makensis -VERSION)" = v3.13
      - name: Check packaging logic
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 platform/windows/installer/test_packager.py -v
      - name: Build macOS ARM64 and run portable tests
        run: |
          cmake -S . -B build/release-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DBUILD_TESTING=ON
          cmake --build build/release-macos --parallel 3 --target \
            FAHSaver fah_core_tests fah_snapshot_cache_tests fah_live_model_tests \
            fah_decimal_input_tests fah_source_tests fah_thread_sample
          ctest --test-dir build/release-macos --output-on-failure \
            -R '^(core|snapshot_cache|live_model|decimal_input|source_protocol|thread_attribution_logic)$'
      - name: Prepare pinned Windows cross-build tools
        run: python3 tools/bootstrap-windows.py --cache build/release-tools
      - name: Build Windows x64
        run: |
          cmake -S . -B build/release-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/windows-zig.cmake" \
            -DFAH_WINDOWS_TOOLS="$PWD/build/release-tools" \
            -DFAH_GLSLANG_VALIDATOR="$(command -v glslangValidator)"
          cmake --build build/release-windows --parallel 3 --target \
            fah_saver_windows fah_windows_options_tests fah_windows_installer_lifecycle
      - name: Package and verify release assets
        run: |
          python3 tools/release.py package --tag "$RELEASE_TAG" \
            --mac-bundle build/release-macos/platform/macos/FAHSaver.saver \
            --windows-build build/release-windows/platform/windows \
            --output build/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: build/release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify downloaded assets
        run: python3 tools/release.py verify --tag "$RELEASE_TAG" --output release-assets
      - name: Create draft for native acceptance checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "FAH Saver $RELEASE_TAG" --generate-notes release-assets/*
          # Publish the reviewed draft with a user-authenticated GitHub action.
          # Its release:published event then runs update-homebrew.yml.
